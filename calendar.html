<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order Calendar</title>

    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            padding: 20px;
        }

        .day {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            min-height: 100px;
        }

        .date {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .order {
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<header>
    <h1>February Food Order Calendar</h1>
</header>

<div class="calendar" id="calendar"></div>

<script src="js/calendar.js"></script>
</body>
</html>
